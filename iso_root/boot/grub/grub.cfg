set timeout=3
set default=0

menuentry "WAW OS - World At War (no survivors)" {
    linux /boot/vmlinuz quiet loglevel=0 console=tty1 vt.global_cursor_default=0
    initrd /boot/initrd.img
}

menuentry "WAW OS - Verbose boot (also crashes)" {
    linux /boot/vmlinuz loglevel=3 console=tty1
    initrd /boot/initrd.img
}
