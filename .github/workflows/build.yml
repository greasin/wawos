name: Build WAW OS ISO

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            xorriso \
            grub-pc-bin \
            grub-efi-amd64-bin \
            grub-common \
            mtools \
            debootstrap \
            squashfs-tools

      - name: Build minimal Debian rootfs
        run: |
          sudo mkdir -p ./build/rootfs
          sudo debootstrap \
            --no-check-gpg \
            --variant=minbase \
            --include=linux-image-amd64,busybox-static,xorg,chromium,openbox \
            bookworm \
            ./build/rootfs \
            http://deb.debian.org/debian/ || true
          sudo chroot ./build/rootfs dpkg --configure -a --force-confdef --force-confold 2>/dev/null || true

      - name: Install WAW OS init
        run: |
          sudo chmod -R 777 build/
          
          sudo tee build/rootfs/etc/rc.local > /dev/null << 'EOF'
          #!/bin/sh
          mount -t proc none /proc 2>/dev/null
          mount -t sysfs none /sys 2>/dev/null
          mount -t devtmpfs none /dev 2>/dev/null
          mkdir -p /dev/pts
          mount -t devpts none /dev/pts 2>/dev/null
          echo 0 > /proc/sys/kernel/printk 2>/dev/null

          mkdir -p /media/cdrom /tmp/www /tmp/.X11-unix
          chmod 1777 /tmp/.X11-unix

          mount -o ro /dev/sr0 /media/cdrom 2>/dev/null || \
          mount -o ro /dev/cdrom /media/cdrom 2>/dev/null || true
          [ -f /media/cdrom/wawos/index.html ] && \
            cp /media/cdrom/wawos/index.html /tmp/www/index.html

          export HOME=/root
          export DISPLAY=:0
          export XAUTHORITY=/tmp/.Xauthority

          # Start X with a basic config
          Xorg :0 -nolisten tcp vt1 -config /dev/null &
          sleep 5

          # Set a black background
          xsetroot -solid black 2>/dev/null || true

          # Launch chromium in kiosk mode
          chromium \
            --kiosk \
            --no-sandbox \
            --disable-infobars \
            --no-first-run \
            --disable-translate \
            --disable-features=TranslateUI \
            --disable-gpu \
            --app=file:///tmp/www/index.html &

          wait
          EOF
          sudo chmod +x build/rootfs/etc/rc.local

          sudo tee build/rootfs/init > /dev/null << 'EOF'
          #!/bin/sh
          exec /bin/sh /etc/rc.local
          EOF
          sudo chmod +x build/rootfs/init

      - name: Pack initramfs
        run: |
          sudo mkdir -p build/iso/boot/grub build/iso/wawos
          sudo chmod -R 777 build/

          # Strip unnecessary stuff to shrink the initramfs
          sudo rm -rf build/rootfs/usr/share/doc
          sudo rm -rf build/rootfs/usr/share/man
          sudo rm -rf build/rootfs/usr/share/locale
          sudo rm -rf build/rootfs/usr/share/fonts/X11/100dpi
          sudo rm -rf build/rootfs/usr/share/fonts/X11/75dpi
          sudo rm -rf build/rootfs/var/cache/apt
          sudo rm -rf build/rootfs/var/lib/apt/lists
          sudo rm -rf build/rootfs/usr/share/gtk-doc
          sudo rm -rf build/rootfs/usr/share/info
          sudo rm -rf build/rootfs/usr/share/pixmaps
          sudo rm -rf build/rootfs/usr/lib/python3*
          sudo rm -rf build/rootfs/usr/share/perl*

          cd build/rootfs
          sudo find . | sudo cpio -H newc -o 2>/dev/null | gzip -9 | sudo tee ../iso/boot/initrd.img > /dev/null
          echo "initrd size: $(du -sh ../iso/boot/initrd.img | cut -f1)"

      - name: Copy kernel
        run: |
          VMLINUZ=$(sudo find build/rootfs/boot -name "vmlinuz-*" | head -1)
          echo "Found kernel: $VMLINUZ"
          sudo cp "$VMLINUZ" build/iso/boot/vmlinuz
          echo "kernel size: $(du -sh build/iso/boot/vmlinuz | cut -f1)"

      - name: Copy WAW OS assets
        run: |
          cp iso_root/wawos/index.html build/iso/wawos/
          cp iso_root/boot/grub/grub.cfg build/iso/boot/grub/

      - name: Build bootable ISO
        run: |
          sudo grub-mkrescue \
            -o wawos.iso \
            build/iso \
            -- -volid WAWOS 2>&1
          echo "ISO size: $(du -sh wawos.iso | cut -f1)"

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: wawos-iso
          path: wawos.iso
          retention-days: 30
